name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: write   # Releaseへのアセットアップロードに必要

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # legacy 'tools' パッケージは廃止されたため、明示的に外す
          packages: 'platform-tools'

      # このリポジトリには gradlew が無いため、Gradle 8.4 を明示してインストールする
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NfcReader-debug
          path: app/build/outputs/apk/debug/*.apk

      # `if:` 内で secrets を直接評価できないため、env 経由で判定して output に渡す
      - name: Check signing secrets
        id: check_signing
        env:
          KS_B64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.check_signing.outputs.has_keystore == 'true'
        env:
          KS_B64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      # app/build.gradle.kts は RELEASE_* の4つが揃っているときだけ本番署名を使い、
      # 揃っていなければデバッグ署名にフォールバックする。
      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NfcReader-release
          path: app/build/outputs/apk/release/*.apk

      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

      # ---- Release連携: v*.*.* タグのpush、または Release 作成時のみ ----
      - name: Check if this run should publish to a Release
        id: check_release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [ "${{ github.event_name }}" = "release" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APKs for release
        if: steps.check_release.outputs.should_publish == 'true'
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/*.apk   "release_assets/NfcReader-debug.apk"   || true
          cp app/build/outputs/apk/release/*.apk "release_assets/NfcReader-release.apk" || true

      - name: Publish APKs to GitHub Release
        if: steps.check_release.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
